<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TimeToWish</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Montserrat', sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background: #fff8f7;
      color: #333;
    }

    header {
      text-align: center;
      padding: 60px 20px 20px;
    }

    header img {
      width: 160px;
      height: 160px;
      object-fit: contain;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 2.5em;
      margin: 0 0 10px;
    }

    .description {
      max-width: 600px;
      margin: 0 auto 40px;
      font-size: 1.2em;
      line-height: 1.6;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 60px;
    }

    .buttons a {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 8px;
      background-color: #8f4a4c;
      color: white;
      font-size: 1em;
      transition: background-color 0.3s;
    }

    .buttons a:hover {
      background-color: #005ecb;
    }

    .buttons img {
      width: 20px;
      height: 20px;
    }

    footer {
      margin-top: auto;
      padding: 20px;
      text-align: center;
      background-color: #fceae9;
    }

    footer a {
      margin: 0 15px;
      text-decoration: underline;
      color: #221919;
    }
  </style>
</head>
<body>
  <header>
    <img src="./assets/app_icon.png" alt="TimeToWish Logo" />
    <h1>TimeToWish</h1>
    <p class="description">
        <br/>Because <b>“Belated”</b> is so last year.</br>
        Set reminders, write the perfect message, and be everyone’s favorite wisher.</br>
        Because showing you care should be effortless.
    </p>
  </header>

  <div class="buttons">
    <a href="#">
      <img src="./assets/play_store.png" alt="Play Store Icon" />
      Get it on Play Store
    </a>
    <a href="#">
      <img src="./assets/app_store.png" alt="App Store Icon" />
      Get it on App Store
    </a>
  </div>

  <footer>
    <a href="terms.html">Terms and Conditions</a>
    <a href="privacy.html">Privacy Policy</a>
  </footer>
</body>
</html>
